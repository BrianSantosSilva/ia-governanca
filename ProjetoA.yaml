PostgreSQL: https://www.postgresql.org/docs/
Ollama: https://ollama.com/
2.2. ATENÇÃO — a LLM local é um pré-requisito obrigatório

Instalar e validar o Ollama antes de implementar o gateway.

O protótipo utilizará uma LLM local para gerar chamadas reais, receber metadados de uso e validar o fluxo financeiro sem pagar por tokens.

A instalação do Ollama, por si só, não instala necessariamente o modelo que será executado. Também será necessário baixar pelo menos um modelo compatível com o hardware disponível.

Procedimento
Acesse https://ollama.com/download.
Instale a versão correspondente ao seu sistema operacional.
Abra um terminal.
Baixe um modelo inicial:
ollama pull llama3.2

Execute o modelo:
ollama run llama3.2

Envie uma pergunta simples e verifique se o modelo responde.
Saia da sessão interativa e teste a API local:
curl http://localhost:11434/api/chat \
  -H "Content-Type: application/json" \
  -d '{
    "model": "llama3.2",
    "messages": [
      {
        "role": "user",
        "content": "Responda apenas: ambiente local funcionando"
      }
    ],
    "stream": false
  }'


A API do Ollama disponibiliza métricas de uso, como quantidade de tokens de entrada e saída, além de duração da geração. Essas informações serão utilizadas pelo projeto para registrar o consumo. Consulte https://github.com/ollama/ollama/blob/main/docs/api.md.

Critério de conclusão
O Ollama está instalado.
O modelo foi baixado.
A inferência funciona pelo terminal.
A API local responde em http://localhost:11434.
A resposta inclui os metadados de uso esperados.

Não avance para a implementação do gateway enquanto essa validação não estiver concluída.

Observação sobre hardware

A velocidade depende da memória disponível, do processador e, quando existente, da GPU. Se o computador não suportar confortavelmente o modelo escolhido, selecione um modelo menor disponível no catálogo do Ollama.

O uso local não gera cobrança por token, mas utiliza recursos computacionais e energia elétrica.

3. Arquitetura do protótipo
3.1. Componentes

O sistema será organizado em módulos dentro de um único repositório.

Frontend: dashboard administrativo.
API administrativa: gestão de organizações, usuários, projetos e conectores.
Gateway LLM: recebe chamadas das aplicações e as encaminha aos provedores.
Serviço de políticas: valida permissões, limites e orçamentos.
Ledger financeiro: registra eventos de uso e custos.
Framework de conectores: coleta dados por APIs e CSV.
Workers: executam sincronizações fora do caminho crítico das chamadas de inferência.
PostgreSQL: fonte de verdade dos dados.
Keycloak: provedor local de identidade para testes de SSO.
Ollama: provedor local de inferência.
3.2. Fluxo principal
Uma aplicação envia uma chamada ao gateway.
O gateway autentica a chave virtual.
O serviço de políticas verifica o projeto, o modelo permitido e o orçamento.
O gateway encaminha a requisição ao Ollama ou a outro provedor habilitado.
A resposta e os metadados de utilização são recebidos.
O sistema registra o evento no ledger.
O módulo financeiro calcula o custo com base na tabela de preços configurada.
O dashboard apresenta a utilização e os valores registrados.

Para dados externos, o fluxo é diferente:

Um worker inicia uma sincronização.
O conector consulta uma API oficial ou interpreta um CSV.
Os registros são validados e normalizados.
A origem, o período e os identificadores externos são preservados.
O sistema persiste os registros e atualiza o estado da sincronização.
O módulo de reconciliação compara os custos externos com os registros internos.
