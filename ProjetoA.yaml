AI Spend & Governance Platform
Documento de arquitetura, implementação e execução do protótipo

Versão: 1.0
Objetivo: Provar o conceito de uma plataforma unificada de governança, consumo e custos de inteligência artificial.
Ambiente: Desenvolvimento local
Orçamento-alvo: R$ 0 em serviços pagos durante o desenvolvimento
Stack principal: TypeScript, Node.js, Fastify, React, PostgreSQL, Docker, Keycloak e Ollama.

1. Visão geral do projeto
1.1. Objetivo

Construir um protótipo funcional capaz de demonstrar como uma empresa pode centralizar a governança financeira e operacional de ferramentas de inteligência artificial.

O sistema deverá consolidar informações de:

Consumo de APIs de LLM.
Custos estimados e custos reportados pelos fornecedores.
Licenças corporativas, assentos atribuídos e indicadores de utilização.
Usuários, equipes, projetos e permissões.
Políticas de orçamento e limites de consumo.
Histórico de chamadas e auditoria.
Diferentes provedores de IA por meio de um gateway centralizado.

A plataforma deverá ser capaz de mostrar, em um único dashboard, quanto foi consumido, qual foi o custo, qual é a origem dos dados e onde existem divergências.

1.2. Estratégia de desenvolvimento

O projeto será desenvolvido primeiro como um laboratório local.

Não será necessário contratar infraestrutura de nuvem, banco gerenciado, serviço de autenticação pago ou APIs comerciais para concluir a primeira versão.

O sistema utilizará três tipos de dados:

Dados sintéticos para validar o produto.
Chamadas a uma LLM executada localmente para testar o gateway.
Dados reais de APIs oficiais, quando houver acesso gratuito ou uma conta autorizada disponível.

A arquitetura deverá permitir substituir os componentes de demonstração por integrações reais sem reescrever o domínio financeiro.

1.3. O que não faz parte desta versão
Marketplace de agentes e skills.
Análise de dependências entre agentes e skills.
Faturamento de clientes.
Previsão financeira baseada em machine learning.
Roteamento inteligente de modelos por qualidade e custo.
Implantação multi-região.
Alta disponibilidade de produção.

Esses itens poderão ser avaliados em etapas futuras, mas não são necessários para provar o conceito do projeto atual.

